<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ticking · Pro source preview</title><link rel="stylesheet" href="/terminal/base.css"><link rel="stylesheet" href="/terminal/terminal.css"><link rel="stylesheet" href="/terminal/chart-tools.css"></head><body class="pro-active"><header class="demo-nav"><strong>ticking</strong><nav><a href="#/markets">Markets</a><a href="#/terminal/SOL">Chart</a></nav><span>Chart workspace · source preview · read only</span></header><main id="app"></main><script type="module">
import {terminalPage,mountTerminal} from '/terminal/src/pro-terminal.js';
let dispose,generation=0;
function decodePart(value){try{return decodeURIComponent(value)}catch{return value}}
function route(){
 const hash=location.hash.startsWith('#')?location.hash.slice(1):'';
 const [path,query='']=hash.split('?');
 return {parts:path.split('/').filter(Boolean),params:new URLSearchParams(query)};
}
function mountClassic(root,ident){
 document.body.classList.add('pro-active');
 root.innerHTML=terminalPage();
 dispose=mountTerminal(root,{ident});
}
function render(){
 const gen=++generation;
 dispose?.();dispose=null;
 const root=document.querySelector('#app');
 const {parts,params}=route();
 if(parts[0]==='markets'){
  document.body.classList.remove('pro-active');
  document.title='Markets — ticking';
  root.replaceChildren();
  import('/terminal/src/equities-markets.js').then(mod=>{if(gen!==generation)return;dispose=mod.mountEquityMarkets(root);}).catch(error=>{if(gen===generation)root.textContent=error.message;});
  return;
 }
 const workspace=parts[0]==='console'&&parts[1]==='workspace'?decodePart(parts[2]||''):'';
 if(workspace&&!/^(wallet:|mint:)/i.test(workspace)&&workspace!=='launch'&&workspace!=='auto'){
  document.body.classList.remove('pro-active');
  document.title=workspace+' — ticking';
  root.replaceChildren();
  import('/terminal/src/equities-workspace.js').then(mod=>{
   if(gen!==generation)return;
   dispose=mod.mountEquitiesWorkspace(root,{symbol:workspace,id:params.get('id')||'',network:params.get('network')||params.get('chain')||''},{
    onUnmapped(){if(gen!==generation)return;const inner=dispose;dispose=null;inner?.();document.title='ticking · '+workspace;mountClassic(root,workspace);}
   });
  }).catch(error=>{if(gen===generation)root.textContent=error.message;});
  return;
 }
 let ident='SOL';
 try{ident=decodePart(location.hash.split('/')[2]||'SOL')}catch{}
 document.title='ticking · '+ident;
 mountClassic(root,ident);
}
window.addEventListener('hashchange',render);window.addEventListener('pagehide',()=>dispose?.(),{once:true});render();
</script></body></html>
