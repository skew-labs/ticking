[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.3"
core_affinity = "0.8.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
ruint = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
