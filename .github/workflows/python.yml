name: python
on:
  push:
    branches: [main]
    paths: ["data/**", "charting/**", "aggregator/harness/**", "aggregator/service/**", "ruff.toml", ".github/workflows/python.yml"]
  pull_request:
    paths: ["data/**", "charting/**", "aggregator/harness/**", "aggregator/service/**", "ruff.toml", ".github/workflows/python.yml"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: make py-lint
      - name: byte-compile
        run: python -m compileall -q data charting aggregator/harness aggregator/service
