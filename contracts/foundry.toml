[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 500
fail_on_revert = false

[profile.fork.fuzz]
runs = 24
[rpc_endpoints]
rh = "https://rpc.mainnet.chain.robinhood.com"
